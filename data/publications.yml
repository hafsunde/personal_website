  venue: "JCPP Advances"
  year: 2022
  doi: "10.1002/jcv2.12064"
  type: article
  description: "Adolescents with ADHD had grade point averages more than one standard deviation lower, still 0.6 lower when compared with their own siblings, and the relative deficit was larger for girls and for children of highly educated parents."

- id: lisoy2022music
