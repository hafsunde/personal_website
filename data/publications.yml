  venue: "Journal of Child Psychology and Psychiatry"
  year: 2026
  doi: "10.1111/jcpp.70022"
  type: article
  description: "Across 2.5 million Norwegians, lower parental income is linked to nearly all psychiatric disorders, but the pattern is consistent with a causal effect only in adolescence, while shared family risk factors can fully explain it in adulthood."
  selected: true
  links:
    bluesky: "https://bsky.app/profile/hfsunde.bsky.social/post/3lvm2rppsws2q"
