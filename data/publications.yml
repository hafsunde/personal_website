  venue: "Nature Mental Health"
  year: 2024
  doi: "10.1038/s44220-024-00310-5"
  type: article
  description: "One in nine GP visits in Norway over 14 years involved a mental-health condition, a share exceeded only by musculoskeletal problems and on par with infections and heart and lung conditions."

- id: nordmo2024diminishing
  authors: ["Nordmo, M.", "Kleppestø, T.H.", "Reme, B.-A.", "Sunde, H.F.", "von Soest, T.", "Torvik, F.A."]
  title: "The diminishing association between adolescent mental disorders and educational performance from 2006–2019"
  venue: "JCPP Advances"
  year: 2024
  doi: "10.1002/jcv2.12239"
  type: article
  description: "As ADHD and internalizing diagnoses among Norwegian adolescents more than doubled, the grade gap between diagnosed and undiagnosed students narrowed, pointing to changing diagnostic thresholds as one contributing factor."

- id: landmark2024pain
  authors: ["Landmark, L.", "Sunde, H.F.", "Fors, E.A.", "Kennair, L.E.O.", "Sayadian, A.", "Backelin, C.", "Reme, S.E."]
