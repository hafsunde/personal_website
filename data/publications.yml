- id: aczel2026robustness
  authors: ["Aczel, B."]
  et_al: true
  title: "Investigating the analytical robustness of the social and behavioural sciences"
  venue: "Nature"
  year: 2026
  doi: "10.1038/s41586-025-09844-9"
  type: article
  description: "In a crowdsourced reanalysis of 100 published studies by independent analysts, only 34% of reanalyses reproduced the original result within a narrow tolerance, although 74% reached the same conclusion."

- id: andersen2026parenthood
  authors: ["Andersen, M.L.", "Sunde, H.F.", "Hart, R.K.", "Torvik, F.A."]
  title: "Parenthood and mental health throughout the life course: A total population study"
  venue: "Social Psychiatry and Psychiatric Epidemiology"
  year: 2026
  doi: "10.1007/s00127-026-03091-7"
  type: article
  description: "Parents had a lower risk of mental disorders than childless adults from their thirties into old age, with larger gaps among men and people with less education, and the pattern held when comparing siblings and identical twins."

- id: andersen2026grandparenthood
  authors: ["Andersen, M.L.", "Hart, R.K.", "Sunde, H.F.", "Davies, N.M.", "Torvik, F.A."]
  title: "The cost of caring: Gendered health and labor market effects of grandparenthood"
  venue: "Proceedings of the National Academy of Sciences"
  year: 2026
  doi: "10.1073/pnas.2535409123"
  type: article
  description: "Becoming a grandparent sharply raises respiratory infections in the first two years, and ten years on, employed grandmothers are 12% less likely to work full time, compared with 2% for grandfathers."

- id: reme2026parentalincome
  authors: ["Reme, B.-A.", "Sunde, H.F.", "Torvik, F.A.", "Kinge, J.M.", "Strand, B.H.", "Wörn, J."]
  title: "Parental income in childhood and health outcomes across age groups: a register-based study from Norway"
  venue: "BMC Medicine"
  year: 2026
  doi: "10.1186/s12916-026-04735-w"
  type: article
  description: "People who grew up in low-income households see their GP more often at ages 10–59, most of all for psychological problems, and most of that gap disappears once their own education and income are taken into account."

- id: landmark2026bds
  authors: ["Landmark, L.", "Sunde, H.F.", "Fors, E.A.", "Kennair, L.E.O.", "Reme, S.E."]
  title: "Prevalence of Bodily Distress Syndrome and Prediction of Patient Outcomes: Cohort Study of 3762 Individuals With Persistent Pain"
  venue: "European Journal of Pain"
  year: 2026
  doi: "10.1002/ejp.70212"
  type: article
  description: "Almost all patients at a tertiary pain clinic (92.5%) met the criteria for moderate or severe bodily distress syndrome, and those who did improved less in functioning over the following year."

- id: eilertsen2026maternal
  authors: ["Eilertsen, E.M.", "Eftedal, N.H.", "Cheesman, R.", "Ayorech, Z.", "Ebeltoft, J.C.", "Sunde, H.F.", "Tandberg, A.D.", "Torvik, F.A.", "Ystrom, E."]
  title: "Multivariate maternal effects across the internalizing–externalizing spectrum in childhood: results from the Norwegian mother, father, and child cohort study"
  venue: "Journal of Child Psychology and Psychiatry"
  year: 2026
  doi: "10.1111/jcpp.70111"
  type: article
  description: "Mothers' genes, acting through parenting, explain 7–18% of the variation in children's behaviour problems, mostly through a single general factor, and leaving them out distorts estimates of children's own genetic effects."

- id: kleppesto2026attractive
  authors: ["Kleppestø, T.H.", "Bendixen, M.", "Sunde, H.F.", "Zietsch, B.", "Harper, K.T.", "Karlsen, H.", "Stavang, M.", "Eftedal, N.H.", "Kennair, L.E.O."]
  title: "The attractive personality: Like me, but better"
  venue: "Evolution and Human Behavior"
  year: 2026
  doi: "10.1016/j.evolhumbehav.2025.106811"
  type: article
  description: "Among 538 Norwegian students, people wanted partners similar to themselves on the Big Five traits and especially on social dominance orientation, while low neuroticism was broadly preferred."

# -- 2025 ----------------------------------------------------------------------

- id: sunde2025indirect
  authors: ["Sunde, H.F.", "Eilertsen, E.M.", "Torvik, F.A."]
  title: "Understanding indirect assortative mating and its intergenerational consequences for educational attainment"
  venue: "Nature Communications"
  year: 2025
  doi: "10.1038/s41467-025-60483-0"
  type: article
  description: "Family models using the partners of twins and siblings in 1.5 million Norwegians show that couples match on education mainly through indirect assortment, especially social homogamy, and that about 38% of parent–child similarity in education is environmental."
  selected: true
  links:
    bluesky: "https://bsky.app/profile/hfsunde.bsky.social/post/3lrefdcxbq22l"
    twitter: "https://x.com/hfsunde/status/1806003525249315040"

- id: nordmo2025cognitive
  authors: ["Nordmo, M.", "Sunde, H.F.", "Kleppestø, T.H.", "Nordmo, M.", "Caspi, A.", "Moffitt, T.E.", "Torvik, F.A."]
  title: "Cognitive Abilities and Educational Attainment as Antecedents of Mental Disorders: A Total Population Study of Males"
  venue: "Psychological Science"
  year: 2025
  doi: "10.1177/09567976251347221"
  type: article
  description: "In 272,351 Norwegian conscripts, higher cognitive ability in late adolescence predicted a lower risk of almost every mental disorder studied at ages 36–40, even between brothers, and the link was strongest among men with little education."

- id: eftedal2025beyond
  authors: ["Eftedal, N.H.", "Eilertsen, E.M.", "Sunde, H.F.", "Kleppestø, T.H.", "Ystrom, E.", "Czajkowski, N.O."]
  title: "Beyond additive genetic effects: Explaining family resemblance in school performance across millions of pairs of Norwegian relatives"
  venue: "Proceedings of the National Academy of Sciences"
  year: 2025
  doi: "10.1073/pnas.2419627122"
  type: article
  description: "Models with only additive genetic effects and assortative mating fit much of the data from 82 kinds of relatives, but systematically underestimate how alike identical twins, maternal relatives, in-laws and adoptive relatives are."

- id: skirbekk2025personality
  authors: ["Skirbekk, V.", "Blekesaune, M.", "Sunde, H.F."]
  title: "Personality and fertility dynamics in Norway across four decades – Findings from the HUNT survey"
  venue: "Personality and Individual Differences"
  year: 2025
  doi: "10.1016/j.paid.2024.112862"
  type: article
  description: "Extraverted people had their first child earlier and had more children, while more neurotic people also started earlier but had fewer children, with stronger links in men."

# -- 2024 ----------------------------------------------------------------------

- id: sunde2024genetic
  authors: ["Sunde, H.F.", "Eftedal, N.H.", "Cheesman, R.", "Corfield, E.C.", "Kleppestø, T.H.", "Seierstad, A.C.", "Ystrom, E.", "Eilertsen, E.M.", "Torvik, F.A."]
