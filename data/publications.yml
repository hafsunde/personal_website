  venue: "Scientific Reports"
  year: 2024
  doi: "10.1038/s41598-024-64059-8"
  type: article
  description: "Insomnia and pain intensity were the strongest correlates of disability, and together with psychological distress and fatigue they accounted for about a quarter of its variation."

- id: kleppesto2024adhd
  authors: ["Kleppestø, T.H.", "Eilertsen, E.M.", "van Bergen, E.", "Sunde, H.F.", "Zietsch, B.", "Nordmo, M.", "Eftedal, N.H.", "Havdahl, A.", "Ystrom, E.", "Torvik, F.A."]
  title: "Intergenerational transmission of ADHD behaviors: genetic and environmental pathways"
  venue: "Psychological Medicine"
  year: 2024
  doi: "10.1017/S003329172300315X"
  type: article
  description: "A children-of-twins-and-siblings design shows that parents and children resemble each other in ADHD behaviours mainly through shared genes, with parental behaviours themselves accounting for only about 2% of the variation."

# -- 2023 ----------------------------------------------------------------------

- id: nordmo2023internalizing
  authors: ["Nordmo, M.", "Kleppestø, T.H.", "Sunde, H.F.", "Flatø, M.", "Demange, P.", "Torvik, F.A."]
  title: "The association between parental internalizing disorders and child school performance"
  venue: "npj Science of Learning"
  year: 2023
