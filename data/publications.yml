- id: sunde2026divorce
  authors: ["Sunde, H.F.", "Dierker, P."]
  title: "Are Spouses Similar in Divorce? Investigating Spousal Similarity in Couple-Shared Outcomes"
  venue: "Twin Research and Human Genetics"
  year: 2026
  doi: "10.1017/thg.2026.10050"
  type: article
  description: "Shows how chaining in-laws lets an extended twin model separate spousal similarity from individual effects, finding in 353,210 Norwegian marriages that ignoring it inflates estimates of individual-level influences on divorce."
  selected: true
  links:
    bluesky: "https://bsky.app/profile/hfsunde.bsky.social/post/3mj4z3nwaic2o"

- id: sunde2026parentalincome
  authors: ["Sunde, H.F.", "Eilertsen, E.M.", "Kinge, J.M.", "Kleppestø, T.H.", "Nordmo, M.", "Caspi, A.", "Moffitt, T.E.", "Torvik, F.A."]
