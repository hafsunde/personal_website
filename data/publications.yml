# Publications — single source of truth for the site.
#
# publications.qmd renders the full list from this file; index.qmd renders the
# entries with `selected: true`. Adding a paper is one entry here and nothing else.
# Grouping (preprints first, then years descending) and ordering are computed.
#
# Built from Zotero via MCP and verified against the publisher record: every DOI
# below resolves, and titles, author strings and venues were taken from DOI
# content negotiation (Crossref), not from a rendered page.
#
# Fields:
#   id        unique key, firstauthor + year + keyword
#   authors   ["Family, I.I.", ...]; set `et_al: true` for very large collaborations
#   venue     journal, or preprint server for `type: preprint`
#   year      issue year of the version of record, falling back to the online
#             date where there is no issue (matches ORCID 0000-0001-8797-5422)
#   type      article | preprint
#   selected  editorial — featured on the home page
#   description  editorial — one sentence on what the paper does or finds,
#             written from the abstract; must not restate the title
#   links     editorial — threads and open-access copies; not bibliographic

# -- Preprints -----------------------------------------------------------------

- id: malawsky2026phantom
  authors: ["Malawsky, D.S.", "Hegemann, L.", "Wootton, O.", "Havdahl, A.K.", "Sunde, H.F.", "Martin, H.C."]
  title: "Phantom genetic nurture: assortative mating accounts for most of the apparent association between parental genotypes and childhood cognitive performance"
  venue: "bioRxiv"
  year: 2026
  doi: "10.64898/2026.09.01.748516"
  type: preprint
  description: "Introduces RAVEL, a model that uses two independent polygenic scores, and shows that once assortative mating is modelled, parents' genotypes explain less than 0.5% as much variance in children's test scores as the child's own genotype, down from 10% in naive trio analyses."

- id: vanbergen2025educational
  authors: ["van Bergen, E.", "Sunde, H.F.", "Rowland, C.F.", "Melby-Lervåg, M.", "Torvik, F.A."]
  title: "Why educational inequality runs in families: Genetics matter more than environment"
  venue: "PsyArXiv"
  year: 2025
  doi: "10.31234/osf.io/rehdj_v1"
  type: preprint
  description: "Using register data on 569,035 Norwegian children and extended family models, finds that the .31 correlation between parents' education and children's school achievement is 68% genetic, 12% parental environment and 20% environment shared with the extended family."

