# Publications — single source of truth for the site.
#
# publications.qmd renders the full list from this file; index.qmd renders the
# entries with `selected: true`. Adding a paper is one entry here and nothing else.
# Grouping (preprints first, then years descending) and ordering are computed.
#
# Built from Zotero via MCP and verified against the publisher record: every DOI
# below resolves, and titles, author strings and venues were taken from DOI
# content negotiation (Crossref), not from a rendered page.
#
# Fields:
#   id        unique key, firstauthor + year + keyword
#   authors   ["Family, I.I.", ...]; set `et_al: true` for very large collaborations
#   venue     journal, or preprint server for `type: preprint`
#   year      issue year of the version of record, falling back to the online
#             date where there is no issue (matches ORCID 0000-0001-8797-5422)
#   type      article | preprint
#   selected  editorial — featured on the home page
#   links     editorial — threads and open-access copies; not bibliographic

