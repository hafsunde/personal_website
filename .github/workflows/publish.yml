# Render the Quarto site and deploy it to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Until that is set, the build job still runs (and catches
# render errors) but the deploy job fails.
#
# The publication list is generated by an R chunk (R/publications.R), so the
# build needs R with knitr, rmarkdown and yaml alongside Quarto.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select Python interpreter
        run: |
          echo "CV_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          python --version

      - name: Install CV dependencies
        run: |
          $CV_PYTHON -m pip install -r cv/requirements.txt
          $CV_PYTHON -c "import yaml; print('PyYAML available')"

      - name: Check committed CV PDF matches its sources
        run: $CV_PYTHON scripts/cv.py check

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Check CV generation and stale-file detection
        run: $CV_PYTHON -m unittest discover -s tests -p test_cv.py

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "yaml"))'

      - name: Verify Python CV dependencies before rendering
        run: $CV_PYTHON -c "import yaml; print('PyYAML available')"

      - name: Render
        run: quarto render
        env:
          CV_PYTHON: ${{ env.CV_PYTHON }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
