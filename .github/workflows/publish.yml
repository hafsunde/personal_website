# Deploy the site to GitHub Pages.
#
# The site is built locally and committed with source changes.
# This workflow only verifies and deploys the pre-built _site/ directory.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Until that is set, the deploy job fails.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies for verification
        run: python -m pip install -r cv/requirements.txt

      - name: Verify CV PDF matches its sources
        run: python scripts/cv.py check

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
